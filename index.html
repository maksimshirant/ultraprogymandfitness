      html,

      .initial-shell {
        position: relative;
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        place-items: center;
        overflow: hidden;
      }

      .initial-shell__media,

      .initial-shell__media img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: right center;
      }

      .initial-shell__overlay {
        background:

          radial-gradient(circle at 50% 45%, rgba(245, 184, 0, 0.16), transparent 46%);
      }

      .initial-shell__brand {
        position: relative;
        z-index: 1;
        width: min(62vw, 260px);
        height: auto;
        filter: brightness(0) invert(1);
      }

      .initial-shell__progress {
        position: absolute;
        z-index: 1;
        bottom: max(2rem, env(safe-area-inset-bottom));
        width: min(42vw, 168px);
        height: 2px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
      }

      .initial-shell__progress::after {
        position: absolute;
        inset: 0;
        width: 52%;
        border-radius: inherit;
        background: #f5b800;
        content: '';
        animation: initial-shell-progress 1.1s ease-in-out infinite alternate;
      }

      @keyframes initial-shell-progress {
        from { transform: translateX(-70%); }
        to { transform: translateX(160%); }
      }

      @media (min-width: 1024px) {
        .initial-shell__media img { object-position: center; }
      }

      @media (prefers-reduced-motion: reduce) {
        .initial-shell__progress::after {
          animation: none;
          transform: none;
        }
      }
